<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
    <title id="title">Automation Release Control architecture</title>
    <desc id="description">A component diagram showing the external PLC software validation process, the GAMP 5 qualified release-control system, Git deployment from host to client, PLC deployment, and OPC UA or MQTT machine-state feedback.</desc>

    <defs>
        <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d151d"/>
            <stop offset="1" stop-color="#0a1118"/>
        </linearGradient>
        <linearGradient id="system" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#121d27"/>
            <stop offset="1" stop-color="#0f1821"/>
        </linearGradient>
        <linearGradient id="blue-card" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#12334a"/>
            <stop offset="1" stop-color="#102534"/>
        </linearGradient>
        <linearGradient id="green-card" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#173426"/>
            <stop offset="1" stop-color="#10251b"/>
        </linearGradient>
        <linearGradient id="orange-card" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#342914"/>
            <stop offset="1" stop-color="#241d10"/>
        </linearGradient>
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
        </filter>
        <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1L11 6L1 11Z" fill="#42a5d5"/>
        </marker>
        <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1L11 6L1 11Z" fill="#63dc78"/>
        </marker>
        <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1L11 6L1 11Z" fill="#ffa500"/>
        </marker>
        <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M1 1L11 6L1 11Z" fill="#8795a3"/>
        </marker>
        <style>
            text { font-family: Inter, Arial, sans-serif; }
            .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 2px; }
            .title { fill: #f4f4f4; font-size: 38px; font-weight: 750; letter-spacing: 0.4px; }
            .subtitle { fill: #b8c3ce; font-size: 20px; font-weight: 500; }
            .boundary-title { fill: #f4f4f4; font-size: 18px; font-weight: 750; letter-spacing: 1.4px; }
            .boundary-copy { fill: #9eabb7; font-size: 15px; font-weight: 500; }
            .card-kicker { font-size: 14px; font-weight: 800; letter-spacing: 1.15px; }
            .card-title { fill: #f4f4f4; font-size: 25px; font-weight: 750; }
            .card-copy { fill: #cbd4dc; font-size: 17px; font-weight: 500; }
            .card-detail { fill: #8f9daa; font-size: 14px; font-weight: 500; }
            .path-label { fill: #c7d0d9; font-size: 14px; font-weight: 700; }
            .path-note { fill: #82909d; font-size: 13px; font-weight: 500; }
            .legend { fill: #aeb9c4; font-size: 13px; font-weight: 650; }
        </style>
    </defs>

    <rect width="1600" height="1050" fill="url(#canvas)"/>
    <rect width="1600" height="1050" fill="url(#grid)"/>

    <g aria-label="Diagram title">
        <text x="74" y="78" fill="#ffa500" class="eyebrow">SOFTWARE ARCHITECTURE</text>
        <text x="74" y="124" class="title">Automation Release Control</text>
        <text x="74" y="158" class="subtitle">From releasable Git commit to verified machine state</text>
    </g>

    <g aria-label="External quality process" filter="url(#shadow)">
        <rect x="1060" y="54" width="470" height="158" rx="16" fill="#202a34" stroke="#52606d"/>
        <rect x="1060" y="54" width="5" height="158" rx="2.5" fill="#8795a3"/>
        <text x="1090" y="88" fill="#b4bec8" class="card-kicker">EXTERNAL QUALITY PROCESS</text>
        <text x="1090" y="126" class="card-title" font-size="23">PLC software validation</text>
        <text x="1090" y="154" class="card-copy" font-size="16">Validates and approves applications and libraries</text>
        <text x="1090" y="178" class="card-copy" font-size="16">before a Git version becomes releasable.</text>
        <text x="1494" y="197" text-anchor="end" class="card-detail">Outside release control</text>
    </g>

    <g aria-label="Automation Release Control system boundary">
        <rect x="70" y="252" width="1050" height="714" rx="22" fill="url(#system)" stroke="#3f4e5c" stroke-width="2" filter="url(#shadow)"/>
        <rect x="70" y="252" width="1050" height="5" rx="2.5" fill="#ffa500"/>
        <text x="104" y="295" fill="#ffa500" class="eyebrow">AUTOMATION RELEASE CONTROL</text>
        <rect x="812" y="271" width="276" height="42" rx="21" fill="#ffa500" fill-opacity="0.09" stroke="#ffa500" stroke-opacity="0.35"/>
        <circle cx="839" cy="292" r="6" fill="#ffa500"/>
        <text x="857" y="298" class="boundary-title" font-size="15">GAMP 5 QUALIFIED SYSTEM</text>
        <text x="104" y="326" class="boundary-copy">Release-control software lifecycle and qualification apply inside this boundary.</text>
    </g>

    <g aria-label="Operator workstation" filter="url(#shadow)">
        <rect x="118" y="380" width="264" height="188" rx="16" fill="url(#blue-card)" stroke="#347da5"/>
        <rect x="118" y="380" width="264" height="5" rx="2.5" fill="#42a5d5"/>
        <text x="140" y="416" fill="#69bee5" class="card-kicker">01  OPERATOR WORKSTATION</text>
        <text x="140" y="461" class="card-title">Angular frontend</text>
        <text x="140" y="491" class="card-copy">MVVM interface</text>
        <line x1="140" y1="514" x2="360" y2="514" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="140" y="542" class="card-detail">Release selection  ·  Fleet status</text>
    </g>

    <g aria-label="Application server" filter="url(#shadow)">
        <rect x="458" y="380" width="282" height="188" rx="16" fill="url(#blue-card)" stroke="#347da5"/>
        <rect x="458" y="380" width="282" height="5" rx="2.5" fill="#42a5d5"/>
        <text x="480" y="416" fill="#69bee5" class="card-kicker">02  APPLICATION SERVER</text>
        <text x="480" y="461" class="card-title">C# / ASP.NET</text>
        <text x="480" y="491" class="card-copy">Release API + orchestration</text>
        <line x1="480" y1="514" x2="718" y2="514" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="480" y="542" class="card-detail">Target commands  ·  State ingestion</text>
    </g>

    <g aria-label="Git host" filter="url(#shadow)">
        <rect x="814" y="380" width="268" height="188" rx="16" fill="url(#green-card)" stroke="#4a9f5c"/>
        <rect x="814" y="380" width="268" height="5" rx="2.5" fill="#63dc78"/>
        <text x="836" y="416" fill="#83e694" class="card-kicker">03  GIT HOST</text>
        <text x="836" y="461" class="card-title">Remote repository</text>
        <text x="836" y="491" class="card-copy">Releasable PLC software</text>
        <line x1="836" y1="514" x2="1060" y2="514" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="836" y="540" class="card-detail">Selected commit = target</text>
        <text x="836" y="560" class="card-detail">Previous commit = rollback</text>
    </g>

    <g aria-label="Client computer" filter="url(#shadow)">
        <rect x="814" y="680" width="268" height="184" rx="16" fill="url(#green-card)" stroke="#4a9f5c"/>
        <rect x="814" y="680" width="268" height="5" rx="2.5" fill="#63dc78"/>
        <text x="836" y="716" fill="#83e694" class="card-kicker">04  CLIENT COMPUTER</text>
        <text x="836" y="758" class="card-title" font-size="23">Git client + deployment</text>
        <text x="836" y="787" class="card-copy">Fetch + checkout selected commit</text>
        <line x1="836" y1="810" x2="1060" y2="810" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="836" y="838" class="card-detail">Working copy = deployed version</text>
    </g>

    <g aria-label="PLC and machine" filter="url(#shadow)">
        <rect x="1186" y="650" width="344" height="194" rx="16" fill="url(#orange-card)" stroke="#a97a24"/>
        <rect x="1186" y="650" width="344" height="5" rx="2.5" fill="#ffa500"/>
        <text x="1210" y="688" fill="#ffc052" class="card-kicker">05  PLC / MACHINE</text>
        <text x="1210" y="733" class="card-title">PLC application + libraries</text>
        <text x="1210" y="763" class="card-copy">Machine and runtime state</text>
        <line x1="1210" y1="787" x2="1506" y2="787" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="1210" y="815" class="card-detail">Running version  ·  Operating status</text>
    </g>

    <g aria-label="State feedback protocol" filter="url(#shadow)">
        <rect x="1186" y="894" width="344" height="106" rx="16" fill="#2b2313" stroke="#c48a20"/>
        <rect x="1186" y="894" width="5" height="106" rx="2.5" fill="#ffa500"/>
        <text x="1210" y="925" fill="#ffc052" class="card-kicker">STATE FEEDBACK</text>
        <text x="1210" y="961" class="card-title" font-size="23">OPC UA / MQTT</text>
        <text x="1506" y="983" text-anchor="end" class="card-detail">Version + machine status</text>
    </g>

    <g aria-label="Control path" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M382 446H458" stroke="#42a5d5" stroke-width="4" marker-end="url(#arrow-blue)"/>
        <rect x="391" y="404" width="58" height="25" rx="12.5" fill="#102534" stroke="#42a5d5" stroke-opacity="0.5"/>
        <text x="420" y="421" text-anchor="middle" class="path-label" fill="#8dd3f2">HTTPS</text>
        <text x="420" y="470" text-anchor="middle" class="path-note">release command</text>

        <path d="M740 446H814" stroke="#42a5d5" stroke-width="4" marker-end="url(#arrow-blue)"/>
        <text x="777" y="426" text-anchor="middle" class="path-label">select</text>
        <text x="777" y="470" text-anchor="middle" class="path-note">target commit</text>
    </g>

    <g aria-label="Git deployment path" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M948 568V680" stroke="#63dc78" stroke-width="4" marker-end="url(#arrow-green)"/>
        <rect x="966" y="604" width="112" height="43" rx="12" fill="#10251b" stroke="#63dc78" stroke-opacity="0.45"/>
        <text x="1022" y="622" text-anchor="middle" class="path-label" fill="#93eba2">Git over SSH</text>
        <text x="1022" y="639" text-anchor="middle" class="path-note">fetch + checkout</text>

        <path d="M1082 772H1186" stroke="#63dc78" stroke-width="4" marker-end="url(#arrow-green)"/>
        <text x="1134" y="750" text-anchor="middle" class="path-label">deploy version</text>
    </g>

    <g aria-label="External validation boundary" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1174 212V284Q1174 334 1124 334H948V380" stroke="#8795a3" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow-muted)"/>
        <rect x="1160" y="288" width="174" height="28" rx="14" fill="#121b24" stroke="#52606d"/>
        <text x="1247" y="307" text-anchor="middle" class="path-label">releasable Git version</text>
    </g>

    <g aria-label="Machine-state feedback path" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1358 844V894" stroke="#ffa500" stroke-width="4" marker-end="url(#arrow-orange)"/>
        <text x="1390" y="875" class="path-note">read state</text>

        <path d="M1186 948H778Q744 948 744 914V612Q744 578 710 568" stroke="#ffa500" stroke-width="4" marker-end="url(#arrow-orange)"/>
        <rect x="848" y="924" width="208" height="29" rx="14.5" fill="#211a0e" stroke="#ffa500" stroke-opacity="0.48"/>
        <text x="952" y="944" text-anchor="middle" class="path-label" fill="#ffd07a">return installed state</text>

        <path d="M458 522H382" stroke="#ffa500" stroke-width="4" marker-end="url(#arrow-orange)"/>
        <text x="420" y="548" text-anchor="middle" class="path-note">update frontend</text>
    </g>

    <g aria-label="Legend">
        <rect x="104" y="896" width="618" height="45" rx="14" fill="#0d151d" fill-opacity="0.82" stroke="#34424f"/>
        <circle cx="130" cy="918" r="6" fill="#42a5d5"/>
        <text x="145" y="923" class="legend">Application control</text>
        <circle cx="299" cy="918" r="6" fill="#63dc78"/>
        <text x="314" y="923" class="legend">Git deployment</text>
        <circle cx="443" cy="918" r="6" fill="#ffa500"/>
        <text x="458" y="923" class="legend">Machine feedback</text>
        <circle cx="603" cy="918" r="6" fill="#8795a3"/>
        <text x="618" y="923" class="legend">External</text>
    </g>
</svg>
